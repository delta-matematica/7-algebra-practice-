<body>
  <main class="screen" id="app"></main>
  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7wwU6aSz00bnTL_tSgPDtboxD4x-vvc2BJ5IRHNaFHNC2KVX81vrIsfqAiyx-vA08Aw/exec";
    const M = s => `$${s}$`;
    const FR = (top, bottom) => `\\frac{${top}}{${bottom}}`;
    let studentInfo={firstName:"",lastName:""};
    let testData={score:0,total:40,percentage:0};
    let testTimer=null,floatingMathTimer=null,timeRemaining=2*60*60,testClosed=false,currentQuestionIndex=0,randomizedQuestions=[],studentAnswers=[];

    const questions=[
      {type:"translate",q:`Write this sentence as an algebraic expression: three more than twice a number ${M("x")}.`,choices:[M("2x+3"),M("3x+2"),M("2(x+3)"),M("x+6")],answer:M("2x+3")},
      {type:"simplify",q:`Simplify the algebraic expression: ${M("3x+4x-2x")}.`,choices:[M("5x"),M("7x"),M("9x"),M("5x^2")],answer:M("5x")},
      {type:"translate",q:`Write this sentence as an algebraic expression: the square of a number ${M("n")} increased by ${M("5")}.`,choices:[M("n^2+5"),M("(n+5)^2"),M("5n^2"),M("n+5")],answer:M("n^2+5")},
      {type:"translate",q:`Write this sentence as an algebraic expression: four less than three times the sum of ${M("x")} and ${M("2")}.`,choices:[M("3(x+2)-4"),M("3x+2-4"),M("4-3(x+2)"),M("3(x-2)+4")],answer:M("3(x+2)-4")},
      {type:"translate",q:`Write this sentence as an algebraic expression: the product of ${M("8")} and the difference of ${M("y")} and ${M("5")}.`,choices:[M("8y-5"),M("8(y-5)"),M("8(5-y)"),M("y-40")],answer:M("8(y-5)")},
      {type:"translate",q:`Write this sentence as an algebraic expression: half of a number ${M("x")} added to one third of another number ${M("y")}.`,choices:[M(FR("x+y","2")),M(`${FR("x","2")}+${FR("y","3")}`),M(`${FR("x","3")}+${FR("y","2")}`),M(FR("x+y","3"))],answer:M(`${FR("x","2")}+${FR("y","3")}`)},
      {type:"translate",q:`Write this sentence as an algebraic expression: the product of a number ${M("x")} and its successor.`,choices:[M("x(x+1)"),M("x(x-1)"),M("(x+1)^2"),M("2x+1")],answer:M("x(x+1)")},
      {type:"translate",q:`The sum of a number ${M("x")} and ${M("8")} is divided by ${M("3")}. Write an expression for this situation.`,choices:[M(FR("x+8","3")),M(`${FR("x","3")}+8`),M("3(x+8)"),M("3x+8")],answer:M(FR("x+8","3"))},
      {type:"substitution",q:`Find the value of ${M("|3x-2|")} when ${M("x=5")}.`,choices:[M("11"),M("12"),M("13"),M("17")],answer:M("13")},
      {type:"substitution",q:`What is the value of ${M("6x+4")} when ${M("x=0{,}5")}?`,choices:[M("5"),M("6"),M("7"),M("8")],answer:M("7")},
      {type:"substitution",q:`What is the value of ${M("4x+3")} when ${M(`x=${FR("1","2")}`)}?`,choices:[M("4"),M("5"),M("6"),M("7")],answer:M("5")},
      {type:"substitution",q:`Evaluate ${M("3x+2y")} when ${M("x=0{,}5")} and ${M("y=4")}.`,choices:[M("8{,}5"),M("9{,}5"),M("10"),M("11{,}5")],answer:M("9{,}5")},
      {type:"substitution",q:`Evaluate ${M("8a+2")} when ${M(`a=${FR("3","4")}`)}.`,choices:[M("6"),M("7"),M("8"),M("9")],answer:M("8")},
      {type:"substitution",q:`Evaluate ${M(`${FR("x","2")}+5`)} when ${M("x=1{,}5")}.`,choices:[M("5{,}75"),M("6{,}25"),M("7{,}5"),M("8")],answer:M("5{,}75")},
      {type:"substitution",q:`Evaluate ${M(FR("2x+y","5"))} when ${M(`x=${FR("5","2")}`)} and ${M("y=5")}.`,choices:[M("1"),M("2"),M("3"),M("4")],answer:M("2")},
      {type:"substitution",q:`The formula to convert Celsius to Fahrenheit is ${M(`F=${FR("9","5")}C+32`)}. Find ${M("F")} when ${M("C=20")}.`,choices:[M("52"),M("60"),M("68"),M("72")],answer:M("68")},
      {type:"inputOutput",inputLatex:M("x=4"),ruleLatex:M("3x+2"),q:"What is the output?",choices:[M("10"),M("12"),M("14"),M("16")],answer:M("14")},
      {type:"inputOutput",inputLatex:M("x=12"),ruleLatex:M(`${FR("x","3")}-1`),q:"What is the output?",choices:[M("2"),M("3"),M("4"),M("5")],answer:M("3")},
      {type:"inputOutput",inputLatex:M("x=5, y=4"),ruleLatex:M("2x+y"),q:"What is the output?",choices:[M("12"),M("13"),M("14"),M("15")],answer:M("14")},
      {type:"inputOutput",inputLatex:M("x=3, y=6"),ruleLatex:M(FR("x+y","3")),q:"What is the output?",choices:[M("2"),M("3"),M("4"),M("5")],answer:M("3")},
      {type:"inputOutput",inputLatex:M("x=7"),ruleLatex:M("2(x-1)"),q:"What is the output?",choices:[M("10"),M("12"),M("14"),M("16")],answer:M("12")},
      {type:"inputOutput",inputLatex:M("x=8"),ruleLatex:M(`${FR("x","2")}+4`),q:"What is the output?",choices:[M("6"),M("7"),M("8"),M("9")],answer:M("8")},
      {type:"geometryWordProblem",shape:"triangle",labels:[M("2x"),M("3x+1"),M("2x+3")],q:`The sides of a triangle are ${M("2x")}, ${M("3x+1")}, and ${M("2x+3")}. Find the perimeter when ${M("x=2")}.`,choices:[M("16"),M("18"),M("20"),M("22")],answer:M("18")},
      {type:"geometryWordProblem",shape:"triangle",labels:[M("x+4"),M("2x+1"),M("3x-2")],q:`The sides of a triangle are ${M("x+4")}, ${M("2x+1")}, and ${M("3x-2")}. Find the perimeter when ${M("x=3")}.`,choices:[M("18"),M("19"),M("21"),M("24")],answer:M("21")},

      {type:"geometryWordProblem",shape:"rectangle",labels:[M("3x+2"),M("4x-3")],q:`The dimensions of a rectangle are ${M("3x+2")} and ${M("4x-3")}. Find the area when ${M("x=4")}.`,choices:[M("168"),M("176"),M("182"),M("196")],answer:M("182")},
      {type:"geometryWordProblem",shape:"rectangle",labels:[M("2x+4"),M("x+6")],q:`The dimensions of a rectangle are ${M("2x+4")} and ${M("x+6")}. Find the perimeter when ${M("x=5")}.`,choices:[M("46"),M("48"),M("50"),M("52")],answer:M("50")},
      {type:"geometryWordProblem",shape:"rectangle",labels:[M("2x+4"),M("x+6")],q:`The dimensions of a rectangle are ${M("2x+4")} and ${M("x+6")}. Find the area when ${M("x=5")}.`,choices:[M("140"),M("154"),M("168"),M("180")],answer:M("154")},
      {type:"geometryWordProblem",shape:"rectangle",labels:[M("x+5"),M("2x+1")],q:`The dimensions of a rectangle are ${M("x+5")} and ${M("2x+1")}. Find the area when ${M("x=3")}.`,choices:[M("48"),M("54"),M("56"),M("63")],answer:M("56")},

      {type:"simplify",q:`Simplify the algebraic expression: ${M("5a-2a+7")}.`,choices:[M("3a+7"),M("7a+7"),M("3a-7"),M("10a")],answer:M("3a+7")},
      {type:"simplify",q:`Simplify the algebraic expression: ${M("7m-3+2m+8")}.`,choices:[M("9m+5"),M("9m-11"),M("5m+5"),M("14m+5")],answer:M("9m+5")},

      {type:"simplify",q:`Simplify using the distributive property: ${M("3(2x+5)")}.`,choices:[M("6x+15"),M("6x+5"),M("5x+15"),M("3x+10")],answer:M("6x+15")},
      {type:"simplify",q:`Simplify using the distributive property: ${M("4(x-3)+2x")}.`,choices:[M("6x-12"),M("4x-12"),M("6x+12"),M("2x-12")],answer:M("6x-12")},
      {type:"simplify",q:`Simplify using the distributive property: ${M("2(3x+4y)-x")}.`,choices:[M("5x+8y"),M("6x+8y"),M("5x+4y"),M("7x+8y")],answer:M("5x+8y")},
      {type:"simplify",q:`Simplify using the distributive property: ${M("5(2a-b)+3b")}.`,choices:[M("10a-2b"),M("10a+2b"),M("7a-2b"),M("10a-8b")],answer:M("10a-2b")},
      {type:"simplify",q:`Simplify using the distributive property: ${M("3(2x-3y+4)+5x")}.`,choices:[M("11x-9y+12"),M("6x-9y+17"),M("11x-3y+12"),M("x-9y+12")],answer:M("11x-9y+12")},
      {type:"simplify",q:`Simplify using the distributive property: ${M("4(3m-2n)-5m")}.`,choices:[M("7m-8n"),M("12m-8n"),M("7m+8n"),M("17m-8n")],answer:M("7m-8n")},
      {type:"simplify",q:`Simplify using the distributive property: ${M("2(4p+q)-3(p-q)")}.`,choices:[M("5p+5q"),M("8p+2q"),M("5p-q"),M("11p+5q")],answer:M("5p+5q")}
    ];

    const symbols=["x","y","a","b","n","m","p","k","x + 3","2y","5a - 1","3n = 21","x < 8","y ≥ 4","7 + x","4m","p ÷ 2","2x + 1","a - b","x²"];
    function backgroundHTML(){return `<div class="animated-bg" id="animatedBg"><div class="grid"></div><div class="equation-stream" style="top:18%;font-size:2.2rem;animation-duration:24s;">x + 7 = 15 &nbsp;&nbsp; 3a - 5 = 10 &nbsp;&nbsp; y = 2x + 1 &nbsp;&nbsp; 4m + 8 = 20 &nbsp;&nbsp;</div><div class="equation-stream" style="top:74%;font-size:1.8rem;animation-duration:30s;animation-direction:reverse;">2x = 18 &nbsp;&nbsp; p ÷ 4 = 6 &nbsp;&nbsp; n - 12 = 9 &nbsp;&nbsp; 5k + 3 = 28 &nbsp;&nbsp;</div><div class="orb" style="width:260px;height:260px;top:8%;left:12%;animation-duration:4.5s;"></div><div class="orb" style="width:340px;height:340px;bottom:2%;right:8%;animation-duration:5.8s;"></div><div class="orb" style="width:180px;height:180px;top:48%;right:20%;animation-duration:3.8s;"></div></div><div class="corner-equation eq1">2x + 5 = 17</div><div class="corner-equation eq2">y = 3x - 4</div><div class="corner-equation eq3">a + b = c</div><div class="corner-equation eq4">x &lt; 9</div><div class="footer">© 2026 Delta Matemática | Luis Ramos Jr. All Rights Reserved.</div>`}
    function startFloatingMath(){clearInterval(floatingMathTimer);const bg=document.getElementById("animatedBg");if(!bg)return;function createFloatingMath(){const item=document.createElement("div");item.className="math-symbol";item.textContent=symbols[Math.floor(Math.random()*symbols.length)];item.style.left=Math.random()*100+"vw";item.style.fontSize=(22+Math.random()*42)+"px";item.style.animationDuration=(10+Math.random()*16)+"s";item.style.animationDelay=(-Math.random()*12)+"s";bg.appendChild(item);setTimeout(()=>{if(item&&item.parentNode)item.remove()},26000)}for(let i=0;i<28;i++)createFloatingMath();floatingMathTimer=setInterval(createFloatingMath,1100)}
    function renderOpeningScreen(){document.getElementById("app").innerHTML=`${backgroundHTML()}<section class="main-card"><div class="top-label">7° Grade Mathematics</div><h1>Algebra<span class="title-highlight">Practice Test</span></h1><p class="subtitle">Strengthen your algebra skills through variables, expressions, substitution, input-output models, and geometry word problems.</p><div class="info-row"><div class="info-box"><span>Level</span>Grade 7</div><div class="info-box"><span>Topic</span>Algebra</div><div class="info-box"><span>Format</span>Practice Test</div></div><button class="start-button" onclick="showStudentForm()">Start Test</button></section>`;startFloatingMath()}
    function showStudentForm(){document.getElementById("app").innerHTML=`${backgroundHTML()}<section class="form-card"><div class="top-label">Student Information</div><h2>Before You Begin</h2><p class="note">Please enter your information carefully. Your first name, last name, score, and percentage will be collected when you finish the practice test.</p><div class="form-grid"><div class="input-group"><label for="firstName">First Name</label><input id="firstName" type="text" autocomplete="off" placeholder="Enter first name" /></div><div class="input-group"><label for="lastName">Last Name</label><input id="lastName" type="text" autocomplete="off" placeholder="Enter last name" /></div></div><div class="instruction-box"><h3>Instructions</h3><ul><li>This is a practice test designed for mastery in Grade 7 Algebra.</li><li>The test has 40 multiple-choice questions.</li><li>You need to complete all questions before submitting your answers.</li><li>You may move forward or backward to review and change your answers.</li><li>The time limit is 2 hours.</li><li>When the time is over, the test will automatically close and submit your current work.</li></ul><div class="timer-badge">Time Limit: 2 Hours</div></div><button class="small-button" onclick="beginPracticeTest()">Begin</button></section>`;startFloatingMath()}
    function beginPracticeTest(){
      const firstName=document.getElementById("firstName").value.trim().toUpperCase();
      const lastName=document.getElementById("lastName").value.trim().toUpperCase();
      if(!firstName||!lastName){alert("Please enter both First Name and Last Name.");return}
      studentInfo.firstName=firstName;
      studentInfo.lastName=lastName;
      testClosed=false;
      timeRemaining=2*60*60;
      try{
        randomizedQuestions=buildBalancedRandomQuestions(questions);
        if(!randomizedQuestions||randomizedQuestions.length===0){randomizedQuestions=shuffleArray(questions)}
      }catch(error){
        console.error("Randomizer error:",error);
        randomizedQuestions=shuffleArray(questions);
      }
      studentAnswers=Array(randomizedQuestions.length).fill(null);
      currentQuestionIndex=0;
      startTwoHourTimer();
      showQuestionScreen();
    }
    function showQuestionScreen(){const item=randomizedQuestions[currentQuestionIndex],selectedAnswer=studentAnswers[currentQuestionIndex],answeredCount=studentAnswers.filter(a=>a!==null).length;document.getElementById("app").innerHTML=`${backgroundHTML()}<section class="test-card"><div class="test-header"><div><div class="question-count">Question ${currentQuestionIndex+1} of ${randomizedQuestions.length}</div><div class="note" style="margin:6px 0 0;">Answered: ${answeredCount} of ${randomizedQuestions.length}</div></div><div class="timer-badge" id="timerDisplay">Time Left: 02:00:00</div></div><div class="test-layout"><div class="question-panel"><div class="panel-label">Question</div>${renderQuestionVisual(item)}<div class="question-text">${item.q}</div></div><div class="choices-panel"><div class="panel-label">Answer Choices</div>${item.choices.map((choice,index)=>`<button class="choice-button ${selectedAnswer===choice?"selected":""}" onclick="selectAnswer(${index})"><span class="choice-letter">${String.fromCharCode(65+index)}</span><span>${choice}</span></button>`).join("")}</div></div><div class="test-nav"><button class="nav-button" onclick="previousQuestion()" ${currentQuestionIndex===0?"disabled":""}>Back</button><button class="nav-button" onclick="nextQuestion()" ${currentQuestionIndex===randomizedQuestions.length-1?"disabled":""}>Next</button><button class="submit-button" onclick="submitTest()">Submit</button></div><div class="progress-strip">${randomizedQuestions.map((_,index)=>`<button class="progress-dot ${studentAnswers[index]!==null?"answered":""} ${index===currentQuestionIndex?"active":""}" onclick="goToQuestion(${index})">${index+1}</button>`).join("")}</div></section>`;startFloatingMath();updateTimerDisplay();typesetMath()}
    function typesetMath(){if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise().catch(error=>console.log(error))}}
    function renderInputOutputModel(item){if(item.type!=="inputOutput")return"";return`<div class="io-wrapper"><div class="io-title">Input – Output Model</div><div class="io-stage"><svg class="io-svg" viewBox="0 0 420 175" preserveAspectRatio="xMidYMid meet"><polygon points="16,56 72,56 108,86 72,116 16,116" fill="rgba(142,238,255,0.12)" stroke="rgba(142,238,255,0.90)" stroke-width="3"/><rect x="108" y="77" width="32" height="18" rx="6" fill="rgba(142,238,255,0.18)" stroke="rgba(142,238,255,0.90)" stroke-width="2.5"/><rect x="140" y="45" width="150" height="82" rx="9" fill="rgba(255,215,91,0.14)" stroke="rgba(255,215,91,0.95)" stroke-width="3"/><rect x="290" y="77" width="55" height="20" rx="8" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.85)" stroke-width="2.5"/><circle cx="374" cy="87" r="30" fill="rgba(255,215,91,0.12)" stroke="rgba(255,215,91,0.95)" stroke-width="3"/></svg><div class="io-caption input-cap">Input</div><div class="io-caption rule-cap">Expression</div><div class="io-caption output-cap">Output</div><div class="io-tag io-input">${item.inputLatex}</div><div class="io-tag io-rule">${item.ruleLatex}</div><div class="io-tag io-output">?</div></div></div>`}
    function renderGeometryFigure(item){if(item.type!=="geometryWordProblem")return"";if(item.shape==="triangle")return`<div class="geometry-box"><div class="io-title">Figure</div><div class="geometry-stage"><svg class="geom-svg" viewBox="0 0 420 220" preserveAspectRatio="xMidYMid meet"><polygon points="210,28 70,180 350,180" fill="rgba(255,255,255,0.04)" stroke="rgba(255,215,91,0.95)" stroke-width="4"/></svg><div class="geom-label" style="left:48px;top:98px;">${item.labels[0]}</div><div class="geom-label" style="right:48px;top:98px;">${item.labels[1]}</div><div class="geom-label" style="left:50%;bottom:12px;transform:translateX(-50%);">${item.labels[2]}</div></div></div>`;if(item.shape==="rectangle"){const isSquare=item.labels[0]===item.labels[1];if(isSquare){return`<div class="geometry-box"><div class="io-title">Figure</div><div class="geometry-stage"><svg class="geom-svg" viewBox="0 0 420 220" preserveAspectRatio="xMidYMid meet"><rect x="125" y="42" width="170" height="170" fill="rgba(255,255,255,0.04)" stroke="rgba(142,238,255,0.95)" stroke-width="4"/></svg><div class="geom-label" style="left:50%;top:8px;transform:translateX(-50%);">${item.labels[0]}</div></div></div>`}return`<div class="geometry-box"><div class="io-title">Figure</div><div class="geometry-stage"><svg class="geom-svg" viewBox="0 0 420 220" preserveAspectRatio="xMidYMid meet"><rect x="95" y="50" width="230" height="110" fill="rgba(255,255,255,0.04)" stroke="rgba(142,238,255,0.95)" stroke-width="4"/></svg><div class="geom-label" style="left:50%;top:12px;transform:translateX(-50%);">${item.labels[0]}</div><div class="geom-label" style="right:22px;top:50%;transform:translateY(-50%);">${item.labels[1]}</div></div></div>`}return""}
    function renderQuestionVisual(item){if(item.type==="inputOutput")return renderInputOutputModel(item);if(item.type==="geometryWordProblem")return renderGeometryFigure(item);return""}
    function shuffleArray(arr){const copy=[...arr];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
    function buildBalancedRandomQuestions(allQuestions){
      const groups={};
      allQuestions.forEach(q=>{
        const type=q.type||"general";
        if(!groups[type])groups[type]=[];
        groups[type].push(q);
      });
      Object.keys(groups).forEach(type=>groups[type]=shuffleArray(groups[type]));
      const result=[];
      let lastType="";
      while(result.length<allQuestions.length){
        const availableTypes=Object.keys(groups).filter(type=>groups[type].length>0);
        if(availableTypes.length===0)break;
        let possibleTypes=availableTypes.filter(type=>type!==lastType);
        if(possibleTypes.length===0)possibleTypes=availableTypes;
        const chosenType=possibleTypes[Math.floor(Math.random()*possibleTypes.length)];
        result.push(groups[chosenType].pop());
        lastType=chosenType;
      }
      return result;
    }
    function selectAnswer(choiceIndex){
      studentAnswers[currentQuestionIndex]=randomizedQuestions[currentQuestionIndex].choices[choiceIndex];
      const allAnswered=studentAnswers.every(a=>a!==null);
      const isLastQuestion=currentQuestionIndex===randomizedQuestions.length-1;
      if(isLastQuestion&&allAnswered){showReviewSubmitScreen();return}
      showQuestionScreen();
    }
    function previousQuestion(){if(currentQuestionIndex>0){currentQuestionIndex--;showQuestionScreen()}}function nextQuestion(){if(currentQuestionIndex<randomizedQuestions.length-1){currentQuestionIndex++;showQuestionScreen()}}function goToQuestion(index){currentQuestionIndex=index;showQuestionScreen()}
    function submitTest(){
      const unanswered=studentAnswers.findIndex(a=>a===null);
      if(unanswered!==-1){
        alert(`Please answer all questions before submitting. Question ${unanswered+1} is still unanswered.`);
        currentQuestionIndex=unanswered;
        showQuestionScreen();
        return;
      }
      showReviewSubmitScreen();
    }

    function showReviewSubmitScreen(){
      const answeredCount=studentAnswers.filter(a=>a!==null).length;
      document.getElementById("app").innerHTML=`${backgroundHTML()}<section class="result-card"><div class="top-label">Review Before Submit</div><h2>All Questions Answered</h2><p class="note" style="font-size:1.15rem;font-weight:800;color:#8eeeff;">You answered ${answeredCount} out of ${randomizedQuestions.length} questions.</p><p class="note">You may review your answers before submitting. Once you submit, your score and percentage will be shown and prepared for collection.</p><div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:30px;"><button class="nav-button" onclick="currentQuestionIndex=0;showQuestionScreen();">Review Answers</button><button class="submit-button" onclick="finalSubmitTest()">Submit Test</button></div></section>`;
      startFloatingMath();
    }

    function finalSubmitTest(){
      clearInterval(testTimer);
      let correct=0;
      randomizedQuestions.forEach((q,i)=>{if(studentAnswers[i]===q.answer)correct++});
      calculateScore(correct,randomizedQuestions.length);
      showResultScreen();
      submitScoreToGoogleSheets();
    }
    function startTwoHourTimer(){clearInterval(testTimer);testTimer=setInterval(()=>{if(testClosed){clearInterval(testTimer);return}timeRemaining--;updateTimerDisplay();if(timeRemaining<=0)autoCloseTest()},1000)}function updateTimerDisplay(){const d=document.getElementById("timerDisplay");if(!d)return;const h=Math.floor(timeRemaining/3600),m=Math.floor((timeRemaining%3600)/60),s=timeRemaining%60;d.textContent=`Time Left: ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
    function autoCloseTest(){if(testClosed)return;testClosed=true;clearInterval(testTimer);let correct=0;randomizedQuestions.forEach((q,i)=>{if(studentAnswers[i]===q.answer)correct++});calculateScore(correct,randomizedQuestions.length);submitScoreToGoogleSheets();showTimeOverScreen()}function showTimeOverScreen(){document.getElementById("app").innerHTML=`${backgroundHTML()}<section class="result-card"><div class="top-label">Time Over</div><h2>Test Closed</h2><p class="note" style="font-size:1.2rem;font-weight:800;color:#ffd75b;">The 2-hour time limit is over.</p><p class="note">Your current work has been automatically submitted. This test screen is now closed.</p></section>`;startFloatingMath()}
    function calculateScore(correctAnswers,totalQuestions){testData.score=correctAnswers;testData.total=totalQuestions;testData.percentage=Math.round((correctAnswers/totalQuestions)*100)}async function submitScoreToGoogleSheets(){const payload={firstName:studentInfo.firstName,lastName:studentInfo.lastName,score:testData.score,percentage:testData.percentage};console.log("Score data prepared:",payload);if(!GOOGLE_SCRIPT_URL){console.warn("Google Script URL is empty. Paste your Google Apps Script Web App URL into GOOGLE_SCRIPT_URL when ready.");return}try{await fetch(GOOGLE_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});console.log("Score submitted to Google Sheets.")}catch(error){console.error("Score submission failed:",error)}}
    function showResultScreen(){
      const remark=testData.percentage>=70?"CONGRATULATIONS":"TRY AGAIN";
      const remarkColor=testData.percentage>=70?"#ffd75b":"#ff9b9b";
      document.getElementById("app").innerHTML=`${backgroundHTML()}<section class="result-card"><div class="top-label">Result</div><div class="student-name-result">Student: ${studentInfo.firstName} ${studentInfo.lastName}</div><div class="result-number">${testData.score} / ${testData.total}</div><p class="note" style="font-size:1.8rem;font-weight:950;color:#8eeeff;">Percentage: ${testData.percentage}%</p><p class="note" style="font-size:2.25rem;font-weight:950;color:${remarkColor};letter-spacing:1.5px;text-transform:uppercase;">${remark}</p><p class="note">Your First Name, Last Name, Score, and Percentage are now prepared for collection.</p><button class="small-button" onclick="renderOpeningScreen()">Back to Opening</button></section>`;
      startFloatingMath();
    }
    renderOpeningScreen();
  </script>
</body>
